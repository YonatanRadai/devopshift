services:
  web:
    build: ./fe
    ports:
      - "5002:5002"
    depends_on:
      - backend-service
    networks:
      - internal

  backend-service:
    build: ./be
    ports:
      - "5001:5001"
    networks:
      - internal
    environment:
      - MYSQL_HOST=mysqldb
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456

  mysqldb:
    image: mysql:5.7
    ports:
      - "5003:3306"
    networks:
      - internal
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: crypto_db

networks:
  internal:
    driver: bridge
